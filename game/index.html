<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7490">
  <meta name="description" content="Mystery Island: a child-friendly learning adventure. Explore islands, solve puzzles and find the treasure.">
  <title>Mystery Island</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mystery Island">
  <link rel="icon" href="assets/ui/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/ui/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <div class="splash" id="boot">
      <div class="splash-logo" aria-hidden="true">🏝️</div>
      <h1 class="splash-title">Mystery Island</h1>
      <p class="splash-sub">Loading your adventure…</p>
    </div>
  </div>
  <div id="toast-layer" class="toast-layer" aria-live="assertive"></div>
  <div id="modal-layer" class="modal-layer"></div>
  <noscript>
    <p class="noscript">Mystery Island needs JavaScript to run. Please turn it on in your browser settings.</p>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
